<!DOCTYPE html>

<head>

    <title>busca_paciente</title>
     <link rel="stylesheet" href="../css/style.css">

    <body>
        <header>   
            <div>
                 <h2><i class="fa-solid fa-hospital"></i> SIGEH - Sistema de Gestão Hospitalar</h2>
                <a href="sigeh_login.html"><button>Sair</button></a>
            </div>
        </header>
        <main>
            <fieldset>
                <legend>Busca de Pacientes</legend>
                 <nav>
                    <label for="nome"><strong>Nome do paciente:</strong></label>
                    <input type="text" id="nome" name="nome">
                    <label for="data_nascimento">Data de Nascimento:</label>
                    <input type="date" id="data_nascimento" name="data_nascimento">
                    <button type="#">Buscar</button>
                 </nav>     
            </fieldset>
            <fieldset>
                <legend>Lista de Pacientes </legend>
                <table = border "1">
                    <tr >
                        <th>Nome</th>
                        <th> Data de Nacimento </th>
                        <th>CPF</th>
                        <th>Nº do prontuário</th>
                        <th>Contato</th>
                        <th>Cidade</th>
                        <th>Ações</th>
                    </tr>
